[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-trans-to-word-notebook"
version = "0.1.0"
description = "Offline Windows word lookup tool that appends results to a Word notebook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyboard>=0.13.5",
    "mouse>=0.7.1",
    "pyperclip>=1.9.0",
    "python-docx>=1.1.2",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
wordtrans-notebook = "src.app:main"

[tool.setuptools]
packages = ["src", "src.resources", "src.ui"]

[tool.setuptools.package-data]
"src.resources" = ["*.csv", "*.sqlite3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
